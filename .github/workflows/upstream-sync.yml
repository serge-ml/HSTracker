name: HSTracker upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare-sync-pr:
    runs-on: macos-15
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Fetch official HSTracker
        run: |
          git remote add upstream https://github.com/HearthSim/HSTracker.git
          git fetch --prune upstream master

      - name: Detect upstream changes
        id: status
        run: |
          marker=".github/upstream-base.sha"
          test -s "$marker"
          upstream_base="$(tr -d '[:space:]' < "$marker")"
          upstream_sha="$(git rev-parse 'upstream/master^{commit}')"
          git cat-file -e "$upstream_base^{commit}"
          if ! git merge-base --is-ancestor "$upstream_base" "$upstream_sha"; then
            echo "Recorded upstream base is not an ancestor of upstream/master."
            exit 1
          fi

          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "upstream_base=$upstream_base" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          if [ "$upstream_base" = "$upstream_sha" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the incremental upstream patch to a unique review branch
        if: steps.status.outputs.changed == 'true'
        id: merge
        env:
          UPSTREAM_BASE: ${{ steps.status.outputs.upstream_base }}
          UPSTREAM_SHA: ${{ steps.status.outputs.upstream_sha }}
        run: |
          short_sha="${UPSTREAM_SHA:0:10}"
          base_sha="$(git rev-parse --short=8 HEAD)"
          branch="sync/hstracker-$short_sha-$base_sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          skipped_workflows="$(
            git diff \
              --name-only \
              "$UPSTREAM_BASE" \
              "$UPSTREAM_SHA" \
              -- .github/workflows
          )"
          {
            echo "skipped_workflows<<EOF"
            echo "$skipped_workflows"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$branch"; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            git switch --detach "origin/$branch"
            test "$(
              tr -d '[:space:]' < .github/upstream-base.sha
            )" = "$UPSTREAM_SHA"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "hstracker-upstream-sync[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          patch="$RUNNER_TEMP/upstream.patch"
          git diff \
            --binary \
            --full-index \
            --find-renames \
            "$UPSTREAM_BASE" \
            "$UPSTREAM_SHA" \
            -- \
            . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/upstream-base.sha' \
            > "$patch"

          apply_status=0
          if [ -s "$patch" ]; then
            set +e
            git apply --3way --index "$patch"
            apply_status=$?
            set -e
          fi
          if [ "$apply_status" -ne 0 ]; then
            conflict_files="$(
              git diff --name-only --diff-filter=U
            )"
            if [ -z "$conflict_files" ]; then
              conflict_files="Patch application failed before Git could produce conflict markers."
            fi
            {
              echo "conflict_files<<EOF"
              echo "$conflict_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "needs_push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$UPSTREAM_SHA" > .github/upstream-base.sha
          git add .github/upstream-base.sha
          git commit \
            -m "chore: sync official HSTracker upstream" \
            -m "Upstream-Base: $UPSTREAM_BASE" \
            -m "Upstream-Commit: $UPSTREAM_SHA"

          echo "conflict=false" >> "$GITHUB_OUTPUT"
          echo "needs_push=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the conflict issue
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.status.outputs.upstream_sha }}
          UPSTREAM_BASE: ${{ steps.status.outputs.upstream_base }}
          BASE_SHA: ${{ steps.status.outputs.base_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.conflict_files }}
        run: |
          short_sha="${UPSTREAM_SHA:0:10}"
          title="[automation] Upstream sync conflict: $short_sha"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue_number="$(
            gh issue list \
              --state open \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number // empty'
          )"
          body="$(
            printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n' \
              "The automated application of official HSTracker changes requires manual resolution." \
              "- Previous integrated upstream: \`$UPSTREAM_BASE\`" \
              "- Upstream: \`$UPSTREAM_SHA\`" \
              "- Fork base: \`$BASE_SHA\`" \
              "- Workflow run: $run_url" \
              "Conflicting files:" \
              "\`\`\`"$'\n'"$CONFLICT_FILES"$'\n'"\`\`\`"
          )"
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      - name: Stop after a merge conflict
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'true'
        run: exit 1

      - name: Push the review branch
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.needs_push == 'true'
        run: git push --set-upstream origin "${{ steps.merge.outputs.branch }}"

      - name: Detect protected delivery changes
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        id: protected
        env:
          BASE_SHA: ${{ steps.status.outputs.base_sha }}
        run: |
          protected_files="$(
            git diff --name-only "$BASE_SHA...HEAD" |
              grep -E \
                '^(\.github/workflows/|HSTracker\.xcodeproj/project\.pbxproj$|HSTracker/Info\.plist$|HSTracker/HSTracker\.entitlements$|scripts/)' \
                || true
          )"
          if [ -n "$protected_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$protected_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure sync labels exist
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create upstream-sync \
            --color "1D76DB" \
            --description "Automated merge from HearthSim/HSTracker" \
            --force
          gh label create automerge \
            --color "0E8A16" \
            --description "Eligible for merge after required checks" \
            --force

      - name: Open or locate the sync pull request
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        id: pull_request
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.status.outputs.upstream_sha }}
          UPSTREAM_BASE: ${{ steps.status.outputs.upstream_base }}
          BASE_SHA: ${{ steps.status.outputs.base_sha }}
          PROTECTED: ${{ steps.protected.outputs.changed }}
          PROTECTED_FILES: ${{ steps.protected.outputs.files }}
          SKIPPED_WORKFLOWS: ${{ steps.merge.outputs.skipped_workflows }}
        run: |
          pr_number="$(
            gh pr list \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -z "$pr_number" ]; then
            if [ -z "$SKIPPED_WORKFLOWS" ]; then
              SKIPPED_WORKFLOWS="(none)"
            fi
            body="$(
              printf '%s\n\n%s\n%s\n%s\n%s\n\n%s\n%s\n\n%s\n' \
                "Automated incremental update from the official HSTracker repository." \
                "- Previous integrated upstream: \`$UPSTREAM_BASE\`" \
                "- Upstream: \`$UPSTREAM_SHA\`" \
                "- Fork base: \`$BASE_SHA\`" \
                "- Protected delivery files changed: \`$PROTECTED\`" \
                "Official upstream workflow files excluded from this fork-owned pipeline:" \
                "\`\`\`"$'\n'"$SKIPPED_WORKFLOWS"$'\n'"\`\`\`" \
                "Merge only after required CI passes. Protected delivery changes require explicit owner review."
            )"
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "chore: sync official HSTracker upstream" \
              --body "$body"
            pr_number="$(
              gh pr view "$BRANCH" --json number --jq '.number'
            )"
          fi
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          gh pr view "$pr_number" --json url --jq '"url=" + .url' \
            >> "$GITHUB_OUTPUT"

          if [ "$PROTECTED" = "true" ]; then
            printf '%s\n%s\n%s\n' \
              "Auto-merge is paused because protected delivery files changed:" \
              "\`\`\`" \
              "$PROTECTED_FILES" > "$RUNNER_TEMP/protected-comment.txt"
            printf '%s\n' "\`\`\`" >> "$RUNNER_TEMP/protected-comment.txt"
            gh pr comment "$pr_number" \
              --body-file "$RUNNER_TEMP/protected-comment.txt"
          fi

      - name: Label the sync pull request
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        run: |
          gh pr edit \
            "${{ steps.pull_request.outputs.number }}" \
            --add-label upstream-sync \
            --add-label automerge

      - name: Dispatch required CI for the PR head
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          existing_run="$(
            gh run list \
              --workflow heartharena-ci.yml \
              --branch "$BRANCH" \
              --limit 50 \
              --json databaseId,headSha,event,status,conclusion |
            jq -r \
              --arg sha "$head_sha" \
              '.[] |
               select(
                 .headSha == $sha and
                 .event == "workflow_dispatch" and
                 (.conclusion == "success" or .status != "completed")
               ) |
               .databaseId' |
            head -n 1
          )"
          if [ -n "$existing_run" ]; then
            echo "CI run $existing_run already covers $head_sha."
          else
            gh workflow run heartharena-ci.yml --ref "$BRANCH"
          fi

      - name: Enable auto-merge for safe sync changes
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false' && steps.protected.outputs.changed == 'false'
        run: |
          gh pr merge \
            "${{ steps.pull_request.outputs.number }}" \
            --auto \
            --merge

      - name: Close superseded sync pull requests
        if: steps.status.outputs.changed == 'true' && steps.merge.outputs.conflict == 'false'
        env:
          CURRENT_PR: ${{ steps.pull_request.outputs.number }}
        run: |
          gh pr list \
            --base "$BASE_BRANCH" \
            --label upstream-sync \
            --state open \
            --json number \
            --jq '.[].number' |
          while read -r pr_number; do
            if [ "$pr_number" != "$CURRENT_PR" ]; then
              gh pr close "$pr_number" \
                --comment "Superseded by #$CURRENT_PR after a newer upstream merge was prepared."
            fi
          done
