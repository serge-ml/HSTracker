name: HSTracker Arena CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: >-
    hstracker-arena-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify fork identity and updater isolation
        run: |
          ./scripts/verify_fork_update_identity.sh
          test ! -e HSTracker/Resources/dsa_pub.pem
          if grep -q \
            -e "da39869dcbc77a77a53506f12ff08094" \
            -e "o35918.ingest.us.sentry.io/92505" \
            HSTracker/AppDelegate.swift; then
            echo "Official HearthSim telemetry endpoints must not be configured"
            exit 1
          fi
          grep -q "io.github.serge-ml.hstrackerarena" HSTracker.xcodeproj/project.pbxproj
          test "$(grep -c 'PRODUCT_MODULE_NAME = HSTracker' HSTracker.xcodeproj/project.pbxproj)" -eq 2
          grep -q "hstracker-arena" HSTracker/Info.plist
          grep -q "hstracker://oauth-callback/hsreplay" \
            HSTracker/HSReplay/HSReplayAPI.swift
          grep -q "ha.1" HSTracker/Info.plist

      - name: Compile and run HearthArena core smoke tests
        run: |
          xcrun swiftc \
            HSTracker/HearthArenaOverlay/Domain/*.swift \
            HSTracker/HearthArenaOverlay/Data/*.swift \
            HSTracker/HearthArenaOverlay/Diagnostics/*.swift \
            scripts/heartharena_core_smoke.swift \
            -o "$RUNNER_TEMP/heartharena-core-smoke"
          "$RUNNER_TEMP/heartharena-core-smoke" \
            HSTrackerTests/HearthArenaOverlay/Fixtures/heartharena-tierlist-sample.html

          xcrun swiftc \
            HSTracker/HearthArenaOverlay/UI/ArenaOverlayLayout.swift \
            scripts/heartharena_layout_smoke.swift \
            -o "$RUNNER_TEMP/heartharena-layout-smoke"
          "$RUNNER_TEMP/heartharena-layout-smoke"

          xcrun swiftc \
            HSTracker/HearthArenaOverlay/Domain/ArenaOffer.swift \
            HSTracker/HearthArenaOverlay/Domain/TierRating.swift \
            HSTracker/HearthArenaOverlay/Integration/ArenaChoiceAdapter.swift \
            scripts/heartharena_adapter_smoke.swift \
            -o "$RUNNER_TEMP/heartharena-adapter-smoke"
          "$RUNNER_TEMP/heartharena-adapter-smoke"

      - name: Run HearthArena core XCTest suite
        run: swift test

      - name: Validate project metadata and scripts
        run: |
          plutil -lint HSTracker.xcodeproj/project.pbxproj
          plutil -lint HSTracker/Info.plist
          plutil -lint HSTracker/HSTracker.entitlements
          xmllint --noout HSTracker/UIs/Base.lproj/MainMenu.xib
          bash -n scripts/cards_download.sh
          bash -n scripts/hstracker_arena_app.sh
          bash -n scripts/verify_fork_update_identity.sh

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HSTracker.xcodeproj \
            -scheme HSTracker \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: Build unsigned Debug app
        if: github.event_name != 'push'
        run: |
          xcodebuild build \
            -project HSTracker.xcodeproj \
            -scheme HSTracker \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned Release app
        run: |
          xcodebuild build \
            -project HSTracker.xcodeproj \
            -scheme HSTracker \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned Release artifact and checksum
        run: |
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release/HSTracker Arena.app"
          artifact_dir="$RUNNER_TEMP/release-artifact"
          test -d "$app"
          mkdir -p "$artifact_dir"
          ditto \
            -c \
            -k \
            --keepParent \
            "$app" \
            "$artifact_dir/HSTracker-Arena-unsigned.zip"
          cd "$artifact_dir"
          shasum -a 256 HSTracker-Arena-unsigned.zip \
            > HSTracker-Arena-unsigned.zip.sha256
          shasum -a 256 -c HSTracker-Arena-unsigned.zip.sha256

      - name: Upload unsigned Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSTracker-Arena-unsigned-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-artifact/HSTracker-Arena-unsigned.zip
            ${{ runner.temp }}/release-artifact/HSTracker-Arena-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14
