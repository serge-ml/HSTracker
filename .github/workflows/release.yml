name: HSTracker Arena Release

on:
  workflow_run:
    workflows:
      - HSTracker Arena CI
    types:
      - completed
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful HSTracker Arena CI run ID from the default branch
        required: true
        type: string

concurrency:
  group: hstracker-arena-release-${{ github.event.workflow_run.id || inputs.ci_run_id }}
  cancel-in-progress: false

jobs:
  sign:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: macos-15
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    outputs:
      sha: ${{ steps.ci.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      asset: ${{ steps.metadata.outputs.asset }}
    steps:
      - name: Verify the source CI run
        id: ci
        run: |
          test -n "$CI_RUN_ID"
          run_json="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          )"
          test "$(jq -r '.name' <<<"$run_json")" = "HSTracker Arena CI"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"

          default_branch="$(
            gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch'
          )"
          test "$(jq -r '.head_branch' <<<"$run_json")" = "$default_branch"
          test "$(
            jq -r '.head_repository.full_name' <<<"$run_json"
          )" = "$GITHUB_REPOSITORY"
          case "$(jq -r '.event' <<<"$run_json")" in
            push|workflow_dispatch) ;;
            *)
              echo "Only trusted default-branch CI runs may release."
              exit 1
              ;;
          esac

          sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_number="$(jq -r '.run_number' <<<"$run_json")"
          test -n "$sha"
          test "$sha" != "null"
          test "$run_number" -gt 0

          if gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -e --arg sha "$sha" \
              '.[] | select(.target_commitish == $sha)' >/dev/null; then
            echo "Commit $sha already has a GitHub Release."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: HSTracker-Arena-unsigned-${{ steps.ci.outputs.sha }}
          path: ${{ runner.temp }}/ci-artifact
          github-token: ${{ github.token }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify and unpack the CI artifact
        run: |
          cd "$RUNNER_TEMP/ci-artifact"
          shasum -a 256 -c HSTracker-Arena-unsigned.zip.sha256
          mkdir -p "$RUNNER_TEMP/signing"
          ditto -x -k \
            HSTracker-Arena-unsigned.zip \
            "$RUNNER_TEMP/signing"
          test -d "$RUNNER_TEMP/signing/HSTracker Arena.app"

      - name: Assign monotonic release metadata
        id: metadata
        env:
          CI_RUN_NUMBER: ${{ steps.ci.outputs.run_number }}
          SOURCE_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          app="$RUNNER_TEMP/signing/HSTracker Arena.app"
          plist="$app/Contents/Info.plist"
          build_number="$((100000 + CI_RUN_NUMBER))"
          version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              "$plist"
          )"
          tag="arena-v${version}-b${build_number}"
          asset="HSTracker-Arena-${version}-${build_number}.zip"

          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $build_number" \
            "$plist"
          test "$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist"
          )" = "$build_number"
          test -z "$(git ls-remote --tags origin "refs/tags/$tag")"

          jq -n \
            --arg sha "$SOURCE_SHA" \
            --arg version "$version" \
            --arg build "$build_number" \
            --arg tag "$tag" \
            --arg asset "$asset" \
            '{
              sha: $sha,
              version: $version,
              build: $build,
              tag: $tag,
              asset: $asset
            }' > "$RUNNER_TEMP/release-metadata.json"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Verify bundle identity and required resources
        run: |
          app="$RUNNER_TEMP/signing/HSTracker Arena.app"
          plist="$app/Contents/Info.plist"
          test "$(
            /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist"
          )" = "io.github.serge-ml.hstrackerarena"
          test "$(
            /usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$plist"
          )" = "https://serge-ml.github.io/HSTracker/appcast.xml"
          test "$(
            /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$plist"
          )" = "7l1tt2vHbSr03uOge75vssUgsmcVN56u12/NffbvbAw="
          test -s \
            "$app/Contents/Resources/Resources/Cards/CardDefs.xml"
          test -s \
            "$app/Contents/Resources/Resources/Managed/BobsBuddy.dll"
          test -s \
            "$app/Contents/Resources/Resources/Managed/arm64/System.Private.CoreLib.dll"
          test -s \
            "$app/Contents/Resources/Resources/Managed/x64/System.Private.CoreLib.dll"
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          plutil -lint "$plist"
          plutil -lint HSTracker/HSTracker.entitlements

      - name: Import Developer ID certificate when configured
        id: certificate
        run: |
          values=(
            "$DEVELOPER_ID_CERTIFICATE_BASE64"
            "$DEVELOPER_ID_CERTIFICATE_PASSWORD"
            "$TEMP_KEYCHAIN_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then
              configured="$((configured + 1))"
            fi
          done
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 3 ]; then
            echo "Developer ID certificate secrets are only partially configured."
            exit 1
          fi
          if [ "$configured" -eq 0 ]; then
            echo "developer_id=false" >> "$GITHUB_OUTPUT"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          umask 077
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" |
            base64 --decode > "$certificate"
          security create-keychain \
            -p "$TEMP_KEYCHAIN_PASSWORD" \
            "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain \
            -p "$TEMP_KEYCHAIN_PASSWORD" \
            "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$TEMP_KEYCHAIN_PASSWORD" \
            "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          identity="$(
            security find-identity \
              -v \
              -p codesigning \
              "$keychain" |
              awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test -n "$identity"
          echo "developer_id=true" >> "$GITHUB_OUTPUT"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Sign nested code and the application
        env:
          DEVELOPER_ID: ${{ steps.certificate.outputs.developer_id }}
          SIGNING_IDENTITY: ${{ steps.certificate.outputs.identity }}
        run: |
          app="$RUNNER_TEMP/signing/HSTracker Arena.app"
          entitlements="$GITHUB_WORKSPACE/HSTracker/HSTracker.entitlements"
          if [ "$DEVELOPER_ID" = "true" ]; then
            leaf_args=(
              --force
              --options runtime
              --timestamp
              --sign "$SIGNING_IDENTITY"
            )
            root_args=(
              --force
              --options runtime
              --timestamp
              --entitlements "$entitlements"
              --sign "$SIGNING_IDENTITY"
            )
          else
            leaf_args=(
              --force
              --timestamp=none
              --sign -
            )
            root_args=(
              --force
              --options runtime
              --timestamp=none
              --entitlements "$entitlements"
              --requirements '=designated => identifier "io.github.serge-ml.hstrackerarena"'
              --sign -
            )
          fi

          while IFS= read -r -d '' file_path; do
            if file -b "$file_path" | grep -q 'Mach-O'; then
              relative_path="${file_path#"$app/Contents/"}"
              case "$relative_path" in
                MacOS/*|*.framework/*|*.xpc/*|*.app/*)
                  continue
                  ;;
              esac
              metadata_args=()
              if codesign -d "$file_path" >/dev/null 2>&1; then
                metadata_args=(
                  --preserve-metadata=identifier,entitlements
                )
              fi
              codesign \
                "${leaf_args[@]}" \
                "${metadata_args[@]}" \
                "$file_path"
            fi
          done < <(find "$app/Contents" -type f -print0)

          find "$app/Contents" -type d \
            \( -name '*.framework' -o -name '*.xpc' -o -name '*.app' \) \
            -print |
            awk '{ print length, $0 }' |
            sort -rn |
            cut -d' ' -f2- |
            while IFS= read -r bundle_path; do
              metadata_args=()
              if codesign -d "$bundle_path" >/dev/null 2>&1; then
                metadata_args=(
                  --preserve-metadata=identifier,entitlements
                )
              fi
              codesign \
                "${leaf_args[@]}" \
                "${metadata_args[@]}" \
                "$bundle_path"
            done

          codesign "${root_args[@]}" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d -r- "$app" 2>&1 |
            grep -q 'identifier "io.github.serge-ml.hstrackerarena"'
          for entitlement in \
            com.apple.security.cs.allow-dyld-environment-variables \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.debugger \
            com.apple.security.cs.disable-library-validation
          do
            codesign -d --entitlements - "$app" 2>/dev/null |
              grep -q "$entitlement"
          done

      - name: Notarize and staple when Developer ID is configured
        if: steps.certificate.outputs.developer_id == 'true'
        run: |
          values=(
            "$APPLE_ID"
            "$APPLE_TEAM_ID"
            "$APPLE_APP_SPECIFIC_PASSWORD"
          )
          for value in "${values[@]}"; do
            if [ -z "$value" ]; then
              echo "All notarization secrets are required for Developer ID releases."
              exit 1
            fi
          done

          app="$RUNNER_TEMP/signing/HSTracker Arena.app"
          notary_archive="$RUNNER_TEMP/notary-submission.zip"
          ditto -c -k --keepParent "$app" "$notary_archive"
          xcrun notarytool submit "$notary_archive" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Download pinned Sparkle release tools
        run: |
          archive="$RUNNER_TEMP/Sparkle-2.9.2.tar.xz"
          tools_dir="$RUNNER_TEMP/sparkle-tools"
          curl \
            --fail \
            --location \
            --retry 4 \
            --output "$archive" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.9.2/Sparkle-2.9.2.tar.xz
          echo \
            "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95  $archive" |
            shasum -a 256 -c -
          mkdir -p "$tools_dir"
          tar -xf "$archive" -C "$tools_dir"
          generate_appcast="$(
            find "$tools_dir" -type f -name generate_appcast -perm +111 -print -quit
          )"
          sign_update="$(
            find "$tools_dir" -type f -name sign_update -perm +111 -print -quit
          )"
          test -x "$generate_appcast"
          test -x "$sign_update"
          echo "GENERATE_APPCAST=$generate_appcast" >> "$GITHUB_ENV"
          echo "SIGN_UPDATE=$sign_update" >> "$GITHUB_ENV"

      - name: Package, Sparkle-sign, and validate the update
        env:
          SOURCE_SHA: ${{ steps.ci.outputs.sha }}
        run: |
          test -n "$SPARKLE_ED_PRIVATE_KEY"
          metadata="$RUNNER_TEMP/release-metadata.json"
          app="$RUNNER_TEMP/signing/HSTracker Arena.app"
          stage="$RUNNER_TEMP/release-stage"
          key_file="$RUNNER_TEMP/sparkle-ed25519.key"
          asset="$(jq -r '.asset' "$metadata")"
          tag="$(jq -r '.tag' "$metadata")"
          version="$(jq -r '.version' "$metadata")"
          build="$(jq -r '.build' "$metadata")"
          zip_path="$stage/$asset"
          notes="$stage/${asset%.zip}.md"

          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key_file"
          trap 'rm -f "$key_file"' EXIT

          derive_script="$RUNNER_TEMP/derive-sparkle-public-key.swift"
          printf '%s\n' \
            'import CryptoKit' \
            'import Foundation' \
            'let url = URL(fileURLWithPath: CommandLine.arguments[1])' \
            'let text = String(data: try Data(contentsOf: url), encoding: .utf8)!' \
            'let encoded = text.trimmingCharacters(in: .whitespacesAndNewlines)' \
            'let seed = Data(base64Encoded: encoded)!' \
            'guard seed.count == 32 else { exit(2) }' \
            'let key = try Curve25519.Signing.PrivateKey(rawRepresentation: seed)' \
            'print(key.publicKey.rawRepresentation.base64EncodedString())' \
            > "$derive_script"
          derived_public_key="$(
            xcrun swift "$derive_script" "$key_file"
          )"
          test "$derived_public_key" = \
            "7l1tt2vHbSr03uOge75vssUgsmcVN56u12/NffbvbAw="

          mkdir -p "$stage"
          ditto -c -k --keepParent "$app" "$zip_path"
          shasum -a 256 "$zip_path" > "$zip_path.sha256"
          shasum -a 256 -c "$zip_path.sha256"
          printf '%s\n\n%s\n%s\n%s\n' \
            "# HSTracker Arena $version ($build)" \
            "- Source commit: \`$SOURCE_SHA\`" \
            "- CI run: $CI_RUN_ID" \
            "- Update channel: HSTracker Arena fork" \
            > "$notes"

          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" |
            "$GENERATE_APPCAST" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/" \
              --link "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
              --embed-release-notes \
              -o "$stage/appcast.xml" \
              "$stage"

          appcast="$stage/appcast.xml"
          test -s "$appcast"
          xmllint --noout "$appcast"
          test "$(
            xmllint \
              --xpath \
              'string(//*[local-name()="item"][1]/*[local-name()="version"][1])' \
              "$appcast"
          )" = "$build"
          grep -q "releases/download/$tag/$asset" "$appcast"
          grep -q 'sparkle:edSignature=' "$appcast"

          archive_signature="$(
            xmllint \
              --xpath \
              'string(//*[local-name()="enclosure"][1]/@*[local-name()="edSignature"])' \
              "$appcast"
          )"
          test -n "$archive_signature"
          "$SIGN_UPDATE" \
            --verify \
            --ed-key-file "$key_file" \
            "$zip_path" \
            "$archive_signature"
          "$SIGN_UPDATE" \
            --ed-key-file "$key_file" \
            "$appcast"
          "$SIGN_UPDATE" \
            --verify \
            --ed-key-file "$key_file" \
            "$appcast"
          rm -f "$key_file"
          trap - EXIT

          cp "$metadata" "$stage/release-metadata.json"

      - name: Upload verified release staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSTracker-Arena-release-${{ steps.ci.outputs.sha }}
          path: ${{ runner.temp }}/release-stage/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: sign
    runs-on: macos-15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sign.outputs.sha }}
          fetch-depth: 0

      - name: Download verified release staging artifact
        uses: actions/download-artifact@v4
        with:
          name: HSTracker-Arena-release-${{ needs.sign.outputs.sha }}
          path: ${{ runner.temp }}/release-stage

      - name: Create and verify the draft GitHub Release
        run: |
          stage="$RUNNER_TEMP/release-stage"
          metadata="$stage/release-metadata.json"
          sha="$(jq -r '.sha' "$metadata")"
          tag="$(jq -r '.tag' "$metadata")"
          asset="$(jq -r '.asset' "$metadata")"
          version="$(jq -r '.version' "$metadata")"
          build="$(jq -r '.build' "$metadata")"
          notes="$stage/${asset%.zip}.md"

          test "$sha" = "${{ needs.sign.outputs.sha }}"
          test "$tag" = "${{ needs.sign.outputs.tag }}"
          test "$asset" = "${{ needs.sign.outputs.asset }}"
          shasum -a 256 -c "$stage/$asset.sha256"
          xmllint --noout "$stage/appcast.xml"

          gh release create "$tag" \
            --draft \
            --target "$sha" \
            --title "HSTracker Arena $version ($build)" \
            --notes-file "$notes"
          gh release upload "$tag" \
            "$stage/$asset" \
            "$stage/$asset.sha256" \
            "$notes"

          verify_dir="$RUNNER_TEMP/draft-verification"
          mkdir -p "$verify_dir"
          gh release download "$tag" \
            --pattern "$asset" \
            --pattern "$asset.sha256" \
            --dir "$verify_dir"
          cd "$verify_dir"
          shasum -a 256 -c "$asset.sha256"

      - name: Publish release, then atomically publish appcast
        run: |
          stage="$RUNNER_TEMP/release-stage"
          metadata="$stage/release-metadata.json"
          tag="$(jq -r '.tag' "$metadata")"
          asset="$(jq -r '.asset' "$metadata")"
          feed_url="https://serge-ml.github.io/HSTracker/appcast.xml"
          pages="$RUNNER_TEMP/pages"
          pages_existed=false
          pages_pushed=false
          previous_pages_sha=""
          published_pages_sha=""

          rollback() {
            set +e
            gh release edit "$tag" --draft --latest=false
            if [ "$pages_pushed" = "true" ]; then
              if [ "$pages_existed" = "true" ]; then
                git push \
                  --force-with-lease="gh-pages:$published_pages_sha" \
                  origin \
                  "$previous_pages_sha:refs/heads/gh-pages"
              else
                git push origin --delete gh-pages
              fi
            fi
          }
          trap rollback ERR

          gh release edit "$tag" --draft=false --latest=false
          asset_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
          curl \
            --fail \
            --location \
            --retry 12 \
            --retry-delay 5 \
            --output "$RUNNER_TEMP/public-release.zip" \
            "$asset_url"
          test "$(
            shasum -a 256 "$RUNNER_TEMP/public-release.zip" |
              awk '{ print $1 }'
          )" = "$(
            awk '{ print $1 }' "$stage/$asset.sha256"
          )"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            pages_existed=true
            previous_pages_sha="$(git rev-parse origin/gh-pages)"
            git worktree add --detach "$pages" origin/gh-pages
          else
            git worktree add --detach "$pages" "${{ needs.sign.outputs.sha }}"
            git -C "$pages" switch --orphan gh-pages
            git -C "$pages" rm -rf . || true
          fi
          cp "$stage/appcast.xml" "$pages/appcast.xml"
          touch "$pages/.nojekyll"
          git -C "$pages" add appcast.xml .nojekyll
          git -C "$pages" commit \
            -m "release: publish $tag appcast"
          published_pages_sha="$(git -C "$pages" rev-parse HEAD)"
          git -C "$pages" push origin HEAD:refs/heads/gh-pages
          pages_pushed=true

          expected_feed_sha="$(
            shasum -a 256 "$stage/appcast.xml" |
              awk '{ print $1 }'
          )"
          verified=false
          for attempt in $(seq 1 24); do
            if curl \
              --fail \
              --location \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/public-appcast.xml" \
              "$feed_url?release=$published_pages_sha"; then
              actual_feed_sha="$(
                shasum -a 256 "$RUNNER_TEMP/public-appcast.xml" |
                  awk '{ print $1 }'
              )"
              if [ "$actual_feed_sha" = "$expected_feed_sha" ]; then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          test "$verified" = "true"
          xmllint --noout "$RUNNER_TEMP/public-appcast.xml"
          grep -q "$asset_url" "$RUNNER_TEMP/public-appcast.xml"
          gh release edit "$tag" --latest
          trap - ERR

      - name: Publish release summary
        run: |
          metadata="$RUNNER_TEMP/release-stage/release-metadata.json"
          tag="$(jq -r '.tag' "$metadata")"
          asset="$(jq -r '.asset' "$metadata")"
          {
            echo "### Published"
            echo
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
            echo "- Asset: $asset"
            echo "- Appcast: https://serge-ml.github.io/HSTracker/appcast.xml"
          } >> "$GITHUB_STEP_SUMMARY"
